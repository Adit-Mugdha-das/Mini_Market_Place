# This workflow defines the Continuous Integration pipeline for building and testing the application
name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # ── Job 1: Run Tests ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Code Quality Check ───────────────────────────────────────────────
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Check code compiles cleanly
        run: ./mvnw compile -q

      - name: Verify no dependency issues
        run: ./mvnw dependency:analyze -DfailOnWarning=false -q

  # ── Job 3: Build Application ────────────────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [ test, quality ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

  # ── Job 4: Build Docker Image ───────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build JAR for Docker
        run: ./mvnw package -DskipTests -q

      - name: Build Docker image
        run: docker build -t haatbazar:${{ github.sha }} .

  # ── Job 5: Deploy to Render (On push and PRs to main branch) ─────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [ build, docker, quality ]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.base_ref == 'main' && github.event_name == 'pull_request')

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl --request POST \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data '{"clearCache":"clear"}' \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"

      - name: Deployment Status
        run: echo "Deployment to Render initiated!"

  # ── Job 6: All Checks Passed ────────────────────────────────────────────────
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [ build, docker, quality, deploy ]

    steps:
      - name: All checks passed
        run: echo "✅ All jobs completed successfully!"

