# Integration test datasource (H2 in-memory, no Postgres needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable async so audit log calls complete synchronously in tests
spring.task.execution.pool.core-size=1

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
