<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Insufficient Stock – HaatBazar</title>    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card {
            background: #fff; border-radius: 16px; padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 100%;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; color: #000000; margin-bottom: 12px; }
        .message { color: #000000; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
        .stock-details {
            background: #ffffff; border-radius: 10px; padding: 16px;
            margin-bottom: 28px; font-size: 0.875rem; color: #b2622f;
        }
        .stock-details p { margin: 4px 0; }
        .stock-details strong { color: #b2622f; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 24px; border-radius: 8px; text-decoration: none;
            font-size: 0.875rem; font-weight: 600; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: linear-gradient(135deg, #165157, #b2622f); color: #fff; }
        .btn-secondary { background: #ffffff; color: #000000; }
    </style>
    <link rel='stylesheet' th:href='@{/css/haatbazar-theme.css}'>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body>
<div class="card">
    <div class="icon">📦</div>
    <h1>Insufficient Stock!</h1>
    <p class="message" th:text="${errorMessage}">Not enough stock available.</p>

    <div class="stock-details">
        <p>Product: <strong th:text="${productName}">Product</strong></p>
        <p>You requested: <strong th:text="${requested}">0</strong> unit(s)</p>
        <p>Available stock: <strong th:text="${available}">0</strong> unit(s)</p>
    </div>

    <div class="actions">
        <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
        <a th:href="@{/buyer/products}" class="btn btn-primary">Browse Products</a>
    </div>
</div>
</body>
</html>
