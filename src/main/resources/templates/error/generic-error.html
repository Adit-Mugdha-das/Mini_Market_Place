<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${errorTitle} ?: 'Error – HaatBazar'">Error</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card {
            background: #fff; border-radius: 16px; padding: 48px 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); text-align: center; max-width: 460px; width: 100%;
        }
        .icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: #000000; margin-bottom: 12px; }
        .message { color: #000000; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block; padding: 10px 24px; border-radius: 8px;
            background: linear-gradient(135deg, #165157, #b2622f);
            color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600;
        }
        .btn:hover { opacity: 0.9; }
    </style>
    <link rel='stylesheet' th:href='@{/css/haatbazar-theme.css}'>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body>
<div class="card">
    <div class="icon">⚠️</div>
    <h1 th:text="${errorTitle} ?: 'Something went wrong'">Error</h1>
    <p class="message" th:text="${errorMessage} ?: 'An unexpected error occurred.'">Error message</p>
    <a href="javascript:history.back()" class="btn">← Go Back</a>
</div>
</body>
</html>
