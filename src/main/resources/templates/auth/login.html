<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Haat Bazar</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        :root {
            --brand-clay: #b2622f;
            --brand-forest: #165157;
            --brand-white: #ffffff;
            --brand-black: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #000000;
            color: var(--brand-white);
        }

        .layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            animation: pageIn 0.7s ease;
        }

        .left-panel {
            background:
                linear-gradient(130deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06)),
                url('/images/unnamed.jpg') center/cover no-repeat;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 28px 34px;
            border-right: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-row img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.38);
            background: #fff;
            box-shadow: 0 10px 26px rgba(0,0,0,0.22);
        }

        .brand-row h1 {
            font-size: clamp(1.35rem, 2.2vw, 1.85rem);
            letter-spacing: 0.3px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            font-family: 'Caveat', cursive;
            font-weight: 700;
            color: #b2622f;
        }

        .right-panel {
            background: linear-gradient(140deg, rgba(22, 81, 87, 0.9), rgba(22, 81, 87, 0.74));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
        }

        .form-shell {
            width: min(440px, 94%);
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.36);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 18px 20px 16px;
            box-shadow: 0 18px 44px rgba(0,0,0,0.28);
        }

        .form-shell h3 {
            font-size: 1.35rem;
            margin-bottom: 4px;
        }

        .form-shell .sub {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.86);
            margin-bottom: 12px;
        }

        .alert {
            padding: 9px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .alert-danger { background: #ffffff; color: #991b1b; }
        .alert-success { background: #ffffff; color: #165157; }

        .form-group { margin-bottom: 10px; }

        label {
            display: block;
            font-size: 0.79rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid rgba(255,255,255,0.34);
            border-radius: 8px;
            font-size: 0.9rem;
            color: #000000;
            background: #ffffff;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--brand-clay);
            box-shadow: 0 0 0 3px rgba(178,98,47,0.22);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 4px 0 12px;
        }

        .remember-row input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--brand-clay);
        }

        .remember-row label {
            margin: 0;
            font-size: 0.79rem;
            font-weight: 600;
            color: rgba(255,255,255,0.92);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            color: var(--brand-white);
            background: linear-gradient(135deg, var(--brand-clay) 0%, #b2622f 100%);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .btn:hover { opacity: 0.94; transform: translateY(-1px); }

        .register-link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.9);
        }

        .register-link a {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover { text-decoration: underline; }

        @keyframes pageIn {
            from { opacity: 0; transform: scale(1.02); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .left-panel { display: none; }
            .right-panel { padding: 14px; }
        }
    </style>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body class="hb-keep-block-layout">
<div class="layout">
    <section class="left-panel">
        <div class="brand-row">
            <img src="/images/Haat_Bazar-logo.png" alt="Haat Bazar logo">
            <h1>Haat Bazar</h1>
        </div>
    </section>

    <section class="right-panel">
        <div class="form-shell">
            <h3>Welcome Back</h3>
            <p class="sub">Sign in to your account</p>

            <!-- Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Flash Success (after registration) -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Logout Message -->
            <div th:if="${logoutMessage}" class="alert alert-success" th:text="${logoutMessage}"></div>

            <form th:action="@{/auth/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" required autofocus />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required />
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember-me" name="remember-me" />
                    <label for="remember-me">Remember me for 7 days</label>
                </div>

                <button type="submit" class="btn">Sign In</button>
            </form>

            <div class="register-link">
                Don't have an account? <a th:href="@{/auth/register}">Create one now</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
