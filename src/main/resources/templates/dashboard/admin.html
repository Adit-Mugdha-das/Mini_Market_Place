<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard – Mini Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        nav {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            color: #fff;
        }
        nav .brand { font-size: 1.2rem; font-weight: 700; }
        nav .user-info { display: flex; align-items: center; gap: 16px; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .welcome {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        }
        .welcome h2 { font-size: 1.5rem; color: #1f2937; margin-bottom: 8px; }
        .welcome p { color: #6b7280; }
        .badge {
            display: inline-block;
            background: #fee2e2;
            color: #991b1b;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<nav>
    <span class="brand">⚙️ Mini Marketplace – Admin</span>
    <div class="user-info">
        <span>Welcome, <strong th:text="${username}">Admin</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" style="background:rgba(255,255,255,0.2);border:none;cursor:pointer;color:#fff;padding:6px 16px;border-radius:20px;font-size:0.9rem;">
                Logout
            </button>
        </form>
    </div>
</nav>
<div class="container">
    <div class="welcome">
        <h2>⚙️ Admin Control Panel</h2>
        <p>Manage users, roles, products, and orders across the platform.</p>
        <span class="badge">ADMIN</span>
    </div>
</div>
</body>
</html>
