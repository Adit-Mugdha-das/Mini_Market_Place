<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' – Mini Marketplace'">Product Detail</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        nav {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 6px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); font-size: 0.875rem; transition: background 0.2s;
        }
        nav .nav-links a:hover { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; cursor: pointer; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; }

        .container { max-width: 680px; margin: 40px auto; padding: 0 20px; }

        .back-link { display: inline-block; color: #667eea; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }

        .card {
            background: #fff; border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 36px;
        }
        .product-name { font-size: 1.6rem; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
        .product-seller { color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; }
        .product-seller strong { color: #4b5563; }
        .product-desc { color: #4b5563; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
        .product-price { font-size: 2rem; font-weight: 700; color: #059669; margin-bottom: 8px; }
        .product-stock { font-size: 0.9rem; color: #6b7280; margin-bottom: 24px; }
        .stock-low { color: #dc2626; font-weight: 600; }

        .divider { border: none; border-top: 1px solid #f3f4f6; margin: 24px 0; }

        .order-form label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 8px; }
        .order-form input[type="number"] {
            width: 120px; padding: 10px 14px; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: 0.95rem; outline: none;
        }
        .order-form input[type="number"]:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .btn-order {
            display: inline-block; margin-top: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; padding: 12px 32px;
            border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        .btn-order:hover { opacity: 0.9; }
        .btn-order:disabled { opacity: 0.5; cursor: not-allowed; }

        .alert-error {
            background: #fee2e2; color: #991b1b; border-radius: 8px;
            padding: 12px 18px; margin-bottom: 20px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
<nav>
    <span class="brand">🛒 Mini Marketplace</span>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/buyer/products}">Browse Products</a>
        <a th:href="@{/buyer/orders}">My Orders</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Buyer</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <a th:href="@{/buyer/products}" class="back-link">← Back to Products</a>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="product-name" th:text="${product.name}">Product Name</div>
        <div class="product-seller">🏪 Sold by: <strong th:text="${product.seller.username}">seller</strong></div>
        <div class="product-desc"
             th:text="${product.description != null and !product.description.isEmpty() ? product.description : 'No description provided.'}">
            Description
        </div>

        <div class="product-price" th:text="'$' + ${#numbers.formatDecimal(product.price,1,2)}">$0.00</div>

        <div class="product-stock">
            <span th:if="${product.quantity > 5}">✅ In stock: <strong th:text="${product.quantity}">0</strong> units</span>
            <span th:if="${product.quantity > 0 and product.quantity <= 5}" class="stock-low">
                ⚠️ Only <strong th:text="${product.quantity}">0</strong> left in stock!
            </span>
            <span th:if="${product.quantity == 0}" class="stock-low">❌ Out of stock</span>
        </div>

        <hr class="divider" />

        <form th:action="@{/buyer/orders/place}" method="post" class="order-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="productId" th:value="${product.id}" />

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity"
                   value="1" min="1" th:max="${product.quantity}"
                   th:disabled="${product.quantity == 0}" />

            <br/>
            <button type="submit" class="btn-order"
                    th:disabled="${product.quantity == 0}">
                🛒 Place Order
            </button>
        </form>
    </div>
</div>
</body>
</html>
