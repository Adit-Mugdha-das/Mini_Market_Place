<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users – Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        nav {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 6px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); font-size: 0.875rem; transition: background 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; cursor: pointer; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; }

        .container { max-width: 1100px; margin: 36px auto; padding: 0 20px; }
        h2 { font-size: 1.4rem; color: #1f2937; margin-bottom: 24px; }

        .alert-success { background: #d1fae5; color: #065f46; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-error   { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.9rem; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 12px 16px; text-align: left; background: #fef2f2;
            font-size: 0.78rem; font-weight: 700; color: #6b7280;
            text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid #fecaca;
        }
        td { padding: 12px 16px; font-size: 0.875rem; color: #374151; border-bottom: 1px solid #f9fafb; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fafafa; }

        .role-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .role-ADMIN  { background: #fee2e2; color: #991b1b; }
        .role-SELLER { background: #dbeafe; color: #1e40af; }
        .role-BUYER  { background: #d1fae5; color: #065f46; }

        .status-active   { color: #059669; font-weight: 600; font-size: 0.8rem; }
        .status-inactive { color: #dc2626; font-weight: 600; font-size: 0.8rem; }

        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn { border: none; cursor: pointer; padding: 6px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-danger  { background: #fee2e2; color: #991b1b; }
        .btn-warning { background: #fef3c7; color: #92400e; }
        .btn-info    { background: #dbeafe; color: #1e40af; }
        .btn-success { background: #d1fae5; color: #065f46; }
        .btn-disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }

        select.role-select {
            padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 0.8rem; background: #fff; cursor: pointer;
        }
    </style>
</head>
<body>
<nav>
    <span class="brand">⚙️ Mini Marketplace – Admin</span>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/users}" class="active">Users</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/admin/orders}">Orders</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Admin</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h2>👥 Manage Users</h2>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert-error"   th:text="${errorMessage}"></div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td><strong th:text="${user.username}">username</strong></td>
                    <td th:text="${user.fullName}">Full Name</td>
                    <td th:text="${user.email}">email@example.com</td>
                    <td>
                        <span th:each="role : ${user.roles}"
                              class="role-badge"
                              th:classappend="'role-' + ${role.name.name().replace('ROLE_','')}"
                              th:text="${role.name.name().replace('ROLE_','')}">BUYER</span>
                    </td>
                    <td>
                        <span th:if="${user.enabled}"  class="status-active">● Active</span>
                        <span th:unless="${user.enabled}" class="status-inactive">● Inactive</span>
                    </td>
                    <td>
                        <!-- Is admin? Show disabled buttons -->
                        <div th:if="${#strings.contains(user.roles.iterator().next().name.name(), 'ADMIN')}" class="actions">
                            <span class="btn btn-disabled">Protected</span>
                        </div>

                        <div th:unless="${#strings.contains(user.roles.iterator().next().name.name(), 'ADMIN')}" class="actions">

                            <!-- Toggle active/inactive -->
                            <form th:action="@{/admin/users/{id}/toggle-enabled(id=${user.id})}" method="post" style="display:inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit"
                                        class="btn"
                                        th:classappend="${user.enabled} ? 'btn-warning' : 'btn-success'"
                                        th:text="${user.enabled} ? 'Deactivate' : 'Activate'">Toggle</button>
                            </form>

                            <!-- Change role -->
                            <form th:action="@{/admin/users/{id}/change-role(id=${user.id})}" method="post" style="display:inline;display:flex;gap:4px;align-items:center;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <select name="role" class="role-select">
                                    <option value="BUYER"  th:selected="${#strings.contains(user.roles.iterator().next().name.name(),'BUYER')}">BUYER</option>
                                    <option value="SELLER" th:selected="${#strings.contains(user.roles.iterator().next().name.name(),'SELLER')}">SELLER</option>
                                </select>
                                <button type="submit" class="btn btn-info">Change</button>
                            </form>

                            <!-- Delete -->
                            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Delete this user? This cannot be undone.');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
