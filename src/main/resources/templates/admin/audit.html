<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Haat Bazar- Admin</title>    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; }
        nav {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 6px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); font-size: 0.875rem; transition: background 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; cursor: pointer; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; }

        .container { max-width: 1200px; margin: 36px auto; padding: 0 20px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        h2 { font-size: 1.4rem; color: #000000; }

        .table-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }

        table { width: 100%; border-collapse: collapse; }
        thead { background: #ffffff; }
        thead th {
            padding: 12px 16px; text-align: left;
            font-size: 0.75rem; font-weight: 700; color: #000000;
            text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 2px solid #ffffff;
        }
        tbody tr:hover { background: #ffffff; }
        td { padding: 11px 16px; font-size: 0.82rem; color: #000000; border-bottom: 1px solid #ffffff; }
        tbody tr:last-child td { border-bottom: none; }

        .actor { font-weight: 700; color: #000000; }

        /* Action type badges */
        .action-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .action-CREATE_PRODUCT    { background: #ffffff; color: #165157; }
        .action-UPDATE_PRODUCT    { background: #ffffff; color: #165157; }
        .action-DELETE_PRODUCT    { background: #ffffff; color: #991b1b; }
        .action-ADMIN_DELETE_PRODUCT { background: #ffffff; color: #dc2626; }
        .action-PLACE_ORDER       { background: rgba(22,81,87,0.16); color: #165157; }
        .action-CANCEL_ORDER      { background: #ffffff; color: #b2622f; }
        .action-ADVANCE_ORDER_STATUS { background: #ffffff; color: #165157; }
        .action-OVERRIDE_ORDER_STATUS { background: #ffffff; color: #b2622f; }
        .action-REGISTER_USER     { background: #ffffff; color: #165157; }
        .action-DELETE_USER       { background: #ffffff; color: #991b1b; }
        .action-TOGGLE_USER_STATUS{ background: #ffffff; color: #000000; }
        .action-CHANGE_USER_ROLE  { background: #ffffff; color: #165157; }

        /* Entity type */
        .entity-badge {
            display: inline-block; padding: 2px 8px; border-radius: 6px;
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
            background: #ffffff; color: #000000;
        }

        .details { color: #000000; font-style: italic; max-width: 280px; }
        .ts { color: #000000; font-size: 0.75rem; white-space: nowrap; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 24px; flex-wrap: wrap; }
        .pagination a, .pagination span {
            display: inline-block; padding: 6px 14px; border-radius: 8px;
            font-size: 0.82rem; font-weight: 600; text-decoration: none;
            border: 1px solid #ffffff; color: #000000; background: #fff;
        }
        .pagination a:hover { background: #ffffff; }
        .pagination .active { background: #dc2626; color: #fff; border-color: transparent; }
        .pagination .disabled { color: #ffffff; pointer-events: none; }

        .empty-state { text-align: center; padding: 60px 20px; color: #000000; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
    <link rel='stylesheet' th:href='@{/css/haatbazar-theme.css}'>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body>
<nav>
    <span class="brand">Haat Bazar</span>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/products}">Products</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <a th:href="@{/admin/reviews}">Reviews</a>
        <a th:href="@{/admin/audit}" class="active">Audit Log</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Admin</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>🔍 Audit Log</h2>
        <span style="color:#000000;font-size:0.85rem;"
              th:text="${logPage.totalElements} + ' total entries'">0 total entries</span>
    </div>

    <div th:if="${logs == null or logs.isEmpty()}" class="empty-state">
        <div class="icon">📋</div>
        <p>No audit entries yet. Actions will appear here as users interact with the system.</p>
    </div>

    <div th:unless="${logs == null or logs.isEmpty()}" class="table-card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Timestamp</th>
                    <th>Actor</th>
                    <th>Action</th>
                    <th>Entity</th>
                    <th>Entity ID</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${logs}">
                    <td th:text="${entry.id}">1</td>
                    <td class="ts"
                        th:text="${#temporals.format(entry.timestamp, 'dd MMM yyyy HH:mm:ss')}">–</td>
                    <td class="actor" th:text="${entry.actorUsername}">user</td>
                    <td>
                        <span class="action-badge"
                              th:classappend="'action-' + ${entry.actionType.name()}"
                              th:text="${entry.actionType.name().replace('_',' ')}">ACTION</span>
                    </td>
                    <td>
                        <span class="entity-badge" th:text="${entry.entityType}">ENTITY</span>
                    </td>
                    <td th:text="${entry.entityId != null ? '#' + entry.entityId : '–'}">–</td>
                    <td class="details" th:text="${entry.details != null ? entry.details : '–'}">–</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div th:if="${totalPages > 1}" class="pagination">
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/audit(page=${currentPage - 1})}">← Prev</a>
        <span th:unless="${currentPage > 0}" class="disabled">← Prev</span>

        <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
            <a th:if="${i != currentPage}"
               th:href="@{/admin/audit(page=${i})}" th:text="${i + 1}">1</a>
            <span th:if="${i == currentPage}" class="active" th:text="${i + 1}">1</span>
        </th:block>

        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/audit(page=${currentPage + 1})}">Next →</a>
        <span th:unless="${currentPage < totalPages - 1}" class="disabled">Next →</span>
    </div>
</div>
</body>
</html>
