<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Haat Bazar- Admin</title>    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; }
        nav {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 6px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); font-size: 0.875rem; transition: background 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; cursor: pointer; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; }

        .container { max-width: 1100px; margin: 36px auto; padding: 0 20px; }
        h2 { font-size: 1.4rem; color: #000000; margin-bottom: 24px; }

        .alert-success { background: #ffffff; color: #165157; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert-error   { background: #ffffff; color: #991b1b; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.9rem; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 12px 16px; text-align: left; background: #ffffff;
            font-size: 0.78rem; font-weight: 700; color: #000000;
            text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid #ffffff;
        }
        td { padding: 12px 16px; font-size: 0.875rem; color: #000000; border-bottom: 1px solid #ffffff; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #ffffff; }

        .price { font-weight: 700; color: #165157; }
        .stock-low { color: #dc2626; font-weight: 600; }
        .status-active   { color: #165157; font-size: 0.8rem; font-weight: 600; }
        .status-inactive { color: #000000; font-size: 0.8rem; font-weight: 600; }

        .btn { border: none; cursor: pointer; padding: 6px 14px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-danger { background: #ffffff; color: #991b1b; }

        .product-name { font-weight: 600; color: #000000; max-width: 180px; }
        .product-desc { color: #000000; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #000000; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
    <link rel='stylesheet' th:href='@{/css/haatbazar-theme.css}'>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body>
<nav>
    <span class="brand">Haat Bazar</span>
    <div class="nav-links">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/users}">Users</a>
        <a th:href="@{/admin/products}" class="active">Products</a>
        <a th:href="@{/admin/orders}">Orders</a>
        <a th:href="@{/admin/reviews}">Reviews</a>
        <a th:href="@{/admin/audit}">Audit Log</a>
        <a th:href="@{/admin/audit}">Audit Log</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Admin</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h2>🛍️ All Products</h2>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert-error"   th:text="${errorMessage}"></div>

    <div th:if="${products == null or products.isEmpty()}" class="empty-state">
        <div class="icon">📦</div>
        <p>No products have been listed yet.</p>
    </div>

    <div th:unless="${products == null or products.isEmpty()}" class="card">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Product Name</th>
                    <th>Description</th>
                    <th>Seller</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                    <th>Listed On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td><div class="product-name" th:text="${product.name}">Name</div></td>
                    <td><div class="product-desc"
                             th:text="${product.description != null and !product.description.isEmpty() ? product.description : '—'}">desc</div></td>
                    <td>🏪 <strong th:text="${product.seller.username}">seller</strong></td>
                    <td class="price" th:text="'$' + ${#numbers.formatDecimal(product.price,1,2)}">$0.00</td>
                    <td>
                        <span th:if="${product.quantity > 5}" th:text="${product.quantity}">0</span>
                        <span th:if="${product.quantity > 0 and product.quantity <= 5}" class="stock-low" th:text="'⚠ ' + ${product.quantity}">⚠ 1</span>
                        <span th:if="${product.quantity == 0}" class="stock-low">Out of stock</span>
                    </td>
                    <td>
                        <span th:if="${product.active}"   class="status-active">● Active</span>
                        <span th:unless="${product.active}" class="status-inactive">● Removed</span>
                    </td>
                    <td th:text="${#temporals.format(product.createdAt,'dd MMM yyyy')}">01 Jan 2025</td>
                    <td>
                        <form th:if="${product.active}"
                              th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post"
                              onsubmit="return confirm('Remove this product? Existing orders will be preserved.');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-danger">Remove</button>
                        </form>
                        <span th:unless="${product.active}" style="color:#000000;font-size:0.8rem;">Removed</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
