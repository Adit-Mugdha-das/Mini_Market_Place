<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haat Bazar</title>
    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        :root {
            --brand-clay: #b2622f;
            --brand-forest: #165157;
            --brand-white: #ffffff;
            --brand-black: #0f1214;
            --shadow: rgba(0, 0, 0, 0.32);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: var(--brand-white);
            background: #0f1214;
            overflow: auto;
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(130deg, rgba(22, 81, 87, 0.84), rgba(178, 98, 47, 0.58)),
                url('/images/hero_bg.png');
            background-size: cover;
            background-position: center;
            transform: scale(1.04);
            animation: bgPan 18s ease-in-out infinite alternate;
        }

        .noise {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 0.8px, transparent 0.8px);
            background-size: 3px 3px;
            opacity: 0.18;
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 22px 28px;
        }

        .topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(10px);
            animation: reveal 0.8s ease 0.35s forwards;
        }

        .brand-row img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            background: var(--brand-white);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .brand-name {
            font-size: clamp(1.2rem, 2.1vw, 1.65rem);
            line-height: 1;
            font-weight: 800;
            color: var(--brand-white);
            letter-spacing: 0.4px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.32);
        }

        .top-actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transform: translateY(8px);
            animation: reveal 0.8s ease 0.55s forwards;
        }

        .hero-center {
            flex: 1;
            width: 100%;
            display: flex;
            margin-top: 60vh;
            justify-content: center;
            text-align: center;
            padding: 32px 12px 20px;
        }

        .hero-copy {
            width: min(900px, 100%);
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            box-shadow: 0 18px 55px var(--shadow);
            backdrop-filter: blur(6px);
            padding: clamp(20px, 3vw, 30px);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: cardIn 0.95s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
        }

        .orb {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(178, 98, 47, 0.82), rgba(178, 98, 47, 0));
            top: -70px;
            right: -75px;
            filter: blur(2px);
            animation: floatOrb 5.5s ease-in-out infinite;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1.05;
            margin-bottom: 14px;
            color: var(--brand-white);
            opacity: 0;
            transform: translateY(10px);
            animation: reveal 0.9s ease 1s forwards;
        }

        h1 span {
            color: #ffd8c0;
            position: relative;
        }

        h1 span::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.28);
        }

        

        .bottom-cta {
            display: flex;
            justify-content: center;
            padding-bottom: 16px;
            opacity: 0;
            transform: translateY(8px);
            animation: reveal 0.9s ease 1.32s forwards;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--brand-forest);
            color: var(--brand-white);
            box-shadow: 0 10px 24px rgba(22, 81, 87, 0.28);
        }

        .btn-secondary {
            background: var(--brand-clay);
            color: var(--brand-white);
            box-shadow: 0 10px 24px rgba(178, 98, 47, 0.26);
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: -120% 45% 100% -45%;
            background: rgba(255, 255, 255, 0.22);
            transform: rotate(20deg);
            transition: inset 0.35s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:hover::before {
            inset: -50% -20% -25% 85%;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bgPan {
            0% { transform: scale(1.04) translate(0, 0); }
            100% { transform: scale(1.1) translate(-1.2%, -1%); }
        }

        @keyframes floatOrb {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }

        @media (max-width: 840px) {
            .page { padding: 14px 12px 20px; }
            .topbar { height: auto; gap: 10px; flex-wrap: wrap; }
            .top-actions { width: 100%; justify-content: flex-end; }
            .hero-center { padding-top: 18px; }
        }
    </style>
</head>
<body>
<div class="hero-bg"></div>
<div class="noise"></div>

<main class="page">
    <header class="topbar">
        <div class="brand-row">
            <img src="/images/Haat_Bazar-logo.png" alt="Haat Bazar logo">
            <div class="brand-name">Haat Bazar</div>
        </div>
        <div class="top-actions">
            <a class="btn btn-primary" th:href="@{/auth/login}">Login</a>
            <a class="btn btn-secondary" th:href="@{/auth/register}">Sign Up</a>
        </div>
    </header>

    <section class="hero-center">
        
           <h1>Step into a smarter <span>digital bazar</span>.</h1>
            
       
    </section>

    <div class="bottom-cta">
        <a class="btn btn-secondary" th:href="@{/products}">Browse Products</a>
    </div>
</main>
</body>
</html>
