<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Product Reviews – HaatBazar</title>    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined">

    <link rel="icon" type="image/png" th:href="@{/images/Haat_Bazar-logo.png}">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; min-height: 100vh; }
        nav {
            background: linear-gradient(135deg, #b2622f 0%, #b2622f 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
            position: sticky; top: 0; z-index: 100;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 6px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none; padding: 6px 16px;
            border-radius: 20px; background: rgba(255,255,255,0.15); font-size: 0.85rem; transition: background 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; color: #fff; padding: 5px 14px; border-radius: 20px; font-size: 0.82rem; }

        .container { max-width: 860px; margin: 36px auto; padding: 0 20px 60px; }
        .page-header { margin-bottom: 28px; }
        .page-header h2 { font-size: 1.5rem; font-weight: 800; color: #000000; }
        .page-header p  { color: #000000; font-size: 0.85rem; margin-top: 4px; }

        .alert-success { background: #ffffff; color: #165157; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.88rem; border-left: 4px solid #165157; }
        .alert-error   { background: #ffffff; color: #991b1b; border-radius: 10px; padding: 12px 18px; margin-bottom: 20px; font-size: 0.88rem; border-left: 4px solid #dc2626; }

        .review-card {
            background: #fff; border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 20px 22px;
            margin-bottom: 16px; border: 1px solid #ffffff;
            transition: box-shadow 0.2s;
        }
        .review-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.09); }
        .review-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .reviewer-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #165157, #b2622f);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 0.9rem; font-weight: 800; flex-shrink: 0;
        }
        .reviewer-name { font-size: 0.88rem; font-weight: 700; color: #000000; }
        .review-meta   { font-size: 0.72rem; color: #000000; margin-top: 2px; }
        .product-tag {
            display: inline-block; background: #ffffff; color: #b2622f;
            font-size: 0.7rem; font-weight: 700; padding: 2px 10px;
            border-radius: 20px; margin-top: 4px;
        }
        .review-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .stars { font-size: 1rem; letter-spacing: 1px; }
        .rating-num { font-size: 0.85rem; font-weight: 800; color: #b2622f; }
        .review-comment {
            margin-top: 12px; font-size: 0.85rem; color: #000000;
            line-height: 1.6; padding-top: 12px; border-top: 1px solid #ffffff;
        }
        .no-comment { font-size: 0.8rem; color: #ffffff; font-style: italic; margin-top: 10px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #000000; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    </style>
    <link rel='stylesheet' th:href='@{/css/haatbazar-theme.css}'>
    <script defer th:src="@{/js/emoji-icons.js}"></script>
</head>
<body>
<nav>
    <span class="brand">🏪 HaatBazar</span>
    <div class="nav-links">
        <a th:href="@{/seller/dashboard}">Dashboard</a>
        <a th:href="@{/seller/products}">My Products</a>
        <a th:href="@{/seller/orders}">Orders</a>
        <a th:href="@{/seller/reviews}" class="active">Reviews</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Seller</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>⭐ Product Reviews</h2>
        <p th:text="${reviews.size()} + ' review(s) on your products'">0 reviews</p>
    </div>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert-error"   th:text="${errorMessage}"></div>

    <div th:if="${reviews.isEmpty()}" class="empty-state">
        <div class="icon">💬</div>
        <p>No reviews yet. Reviews will appear here once buyers review your products.</p>
    </div>

    <div th:each="r : ${reviews}" class="review-card">
        <div class="review-top">
            <div class="reviewer-info">
                <div class="avatar" th:text="${#strings.substring(r.buyerUsername,0,1).toUpperCase()}">U</div>
                <div>
                    <div class="reviewer-name" th:text="${r.buyerUsername}">buyer</div>
                    <div class="review-meta" th:text="${#temporals.format(r.createdAt,'dd MMM yyyy · HH:mm')}">01 Jan 2025</div>
                    <span class="product-tag" th:text="'📦 ' + ${r.productName}">Product</span>
                </div>
            </div>
            <div class="review-right">
                <span class="stars">
                    <th:block th:each="i : ${#numbers.sequence(1,5)}">
                        <span th:if="${i <= r.rating}">⭐</span>
                        <span th:if="${i > r.rating}" style="filter:grayscale(1);opacity:0.3;">⭐</span>
                    </th:block>
                </span>
                <span class="rating-num" th:text="${r.rating} + '/5'">5/5</span>
            </div>
        </div>
        <div th:if="${r.comment != null and !r.comment.isEmpty()}"
             class="review-comment" th:text="${r.comment}"></div>
        <div th:unless="${r.comment != null and !r.comment.isEmpty()}"
             class="no-comment">No written comment.</div>
    </div>
</div>
</body>
</html>
