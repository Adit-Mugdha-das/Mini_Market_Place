<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Products – Mini Marketplace</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        nav {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            padding: 0 32px; display: flex; align-items: center;
            justify-content: space-between; height: 60px; color: #fff;
        }
        nav .brand { font-size: 1.1rem; font-weight: 700; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            color: rgba(255,255,255,0.9); text-decoration: none;
            padding: 6px 16px; border-radius: 20px;
            background: rgba(255,255,255,0.15); font-size: 0.875rem; transition: background 0.2s;
        }
        nav .nav-links a:hover, nav .nav-links a.active { background: rgba(255,255,255,0.3); }
        nav .user-area { display: flex; align-items: center; gap: 12px; font-size: 0.875rem; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; cursor: pointer; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; }
        .btn-logout:hover { background: rgba(255,255,255,0.3); }

        .container { max-width: 1000px; margin: 36px auto; padding: 0 20px; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;
        }
        .page-header h2 { font-size: 1.4rem; color: #1f2937; }

        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.875rem; font-weight: 500; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert-danger  { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

        .btn {
            padding: 9px 20px; border: none; border-radius: 8px; font-size: 0.875rem;
            font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-primary { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); overflow: hidden; }

        table { width: 100%; border-collapse: collapse; }
        thead { background: #fffbeb; }
        thead th { padding: 13px 16px; text-align: left; font-size: 0.8rem; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.05em; }
        tbody tr { border-top: 1px solid #f3f4f6; transition: background 0.15s; }
        tbody tr:hover { background: #fffbeb; }
        td { padding: 14px 16px; font-size: 0.9rem; color: #374151; vertical-align: middle; }

        .product-name { font-weight: 600; color: #1f2937; }
        .product-desc { color: #9ca3af; font-size: 0.8rem; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price { font-weight: 700; color: #059669; }
        .qty-badge {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 0.8rem; font-weight: 600;
        }
        .qty-ok   { background: #dcfce7; color: #166534; }
        .qty-low  { background: #fef3c7; color: #92400e; }
        .qty-zero { background: #fee2e2; color: #991b1b; }

        .actions { display: flex; gap: 8px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { margin-bottom: 20px; }
    </style>
</head>
<body>
<nav>
    <span class="brand">🏪 Mini Marketplace</span>
    <div class="nav-links">
        <a th:href="@{/seller/dashboard}">Dashboard</a>
        <a th:href="@{/seller/products}" class="active">My Products</a>
        <a th:href="@{/seller/orders}">Orders</a>
        <a th:href="@{/seller/reviews}">Reviews</a>
    </div>
    <div class="user-area">
        <span>👤 <strong th:text="${username}">Seller</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="page-header">
        <h2>📦 My Products</h2>
        <a th:href="@{/seller/products/add}" class="btn btn-primary">+ Add Product</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="alert alert-danger"  th:text="${errorMessage}"></div>

    <div class="card">
        <!-- Products table -->
        <div th:if="${products != null and !products.isEmpty()}">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Added</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p, stat : ${products}">
                        <td th:text="${stat.index + 1}">1</td>
                        <td>
                            <div class="product-name" th:text="${p.name}">Product</div>
                            <div class="product-desc" th:text="${p.description}">Desc</div>
                        </td>
                        <td>
                            <span th:if="${p.category != null}"
                                  style="background:#ede9fe;color:#5b21b6;font-size:0.72rem;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;">
                                🏷️ <span th:text="${p.category.name}">Cat</span>
                            </span>
                            <span th:if="${p.category == null}" style="color:#d1d5db;font-size:0.78rem;">—</span>
                        </td>
                        <td class="price" th:text="'$' + ${#numbers.formatDecimal(p.price,1,2)}">$0.00</td>
                        <td>
                            <span th:class="${p.quantity == 0 ? 'qty-badge qty-zero' : (p.quantity < 5 ? 'qty-badge qty-low' : 'qty-badge qty-ok')}"
                                  th:text="${p.quantity}">0</span>
                        </td>
                        <td th:text="${#temporals.format(p.createdAt,'dd MMM yyyy')}">01 Jan 2025</td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/seller/products/edit/{id}(id=${p.id})}"
                                   class="btn btn-secondary btn-sm">✏️ Edit</a>
                                <form th:action="@{/seller/products/delete/{id}(id=${p.id})}"
                                      method="post" style="display:inline"
                                      onsubmit="return confirm('Delete this product?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty state -->
        <div th:if="${products == null or products.isEmpty()}" class="empty-state">
            <div class="icon">📦</div>
            <p>You haven't added any products yet.</p>
            <a th:href="@{/seller/products/add}" class="btn btn-primary">Add Your First Product</a>
        </div>
    </div>
</div>
</body>
</html>
